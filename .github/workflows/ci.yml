name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.11"

jobs:
  api:
    name: api (ruff, mypy, pytest + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hemfin_ci
          POSTGRES_DB: hemfin_ci
          # CI-ONLY throwaway password. The service container is ephemeral and is destroyed when
          # the job ends; it is not reachable from outside the runner and guards no real data.
          # gitleaks allowlists exactly this value (see .gitleaks.toml).
          POSTGRES_PASSWORD: ci-only-throwaway-pg-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hemfin_ci -d hemfin_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-ONLY throwaway credential for the ephemeral service container above.
      DATABASE_URL: postgresql://hemfin_ci:ci-only-throwaway-pg-password@127.0.0.1:5432/hemfin_ci
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # DATABASE_URL is set, so the db-marked tests run (including test_migration_roundtrip).
      # -rs lists skips so a silently skipped db test would be visible in the log.
      - run: uv run pytest -v -rs

  docker:
    name: docker (build + smoke run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hemfin_ci
          POSTGRES_DB: hemfin_ci
          # CI-ONLY throwaway password; ephemeral container (see the api job).
          POSTGRES_PASSWORD: ci-only-throwaway-pg-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hemfin_ci -d hemfin_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: api
          load: true
          push: false
          tags: hemfin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke run against the Postgres service
        run: |
          # Host networking so the container reaches the service on 127.0.0.1:5432.
          # CI-ONLY throwaway credential for the ephemeral service container.
          docker run -d --name api --network host \
            -e APP_ENV=local -e PORT=8000 \
            -e DATABASE_URL=postgresql://hemfin_ci:ci-only-throwaway-pg-password@127.0.0.1:5432/hemfin_ci \
            hemfin-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then
              echo
              echo "api container is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::api container did not become ready"
          docker logs api
          exit 1

  web:
    name: web (tests, drift, lint, build, playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # The drift check regenerates api/openapi.json with uv, so uv is needed here too.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: npm ci
      - run: npm test --workspaces --if-present
      - run: npm run check:api-drift
      - run: npm run lint --workspace web
      - run: npm run build --workspace web
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers and system deps
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright
        run: npx playwright test
        working-directory: web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's checksums file).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # The binary is used instead of gitleaks/gitleaks-action: the action needs a paid
      # GITLEAKS_LICENSE for repos owned by an organization, while the binary is MIT and free.
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
