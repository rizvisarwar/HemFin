name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.11"

# Actions are pinned to full commit SHAs (the comment is the release). Dependabot keeps them fresh.
# The postgres:16 image is pinned by tag only; pinning images by digest is a follow-up.
# No credentials live in this file: each job that needs Postgres starts a throwaway container
# with a random per-run password (generated, masked, exported through $GITHUB_ENV).

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start throwaway Postgres with a per-run random password
        working-directory: .
        run: |
          PW="$(openssl rand -hex 24)"
          echo "::add-mask::$PW"
          docker run -d --name pg \
            -e POSTGRES_USER=hemfin_ci -e POSTGRES_DB=hemfin_ci -e POSTGRES_PASSWORD="$PW" \
            -p 127.0.0.1:5432:5432 postgres:16
          until docker exec pg pg_isready -h 127.0.0.1 -U hemfin_ci -d hemfin_ci; do sleep 1; done
          echo "DATABASE_URL=postgresql://hemfin_ci:${PW}@127.0.0.1:5432/hemfin_ci" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # DATABASE_URL is set, so the db-marked tests run (including test_migration_roundtrip).
      # -rs lists skips so a silently skipped db test would be visible in the log.
      - run: uv run pytest -v -rs

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate docker-compose.yml
        run: |
          # compose requires POSTGRES_PASSWORD; any generated value will do for a syntax check.
          POSTGRES_PASSWORD="$(openssl rand -hex 16)" docker compose config -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          load: true
          push: false
          tags: hemfin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start throwaway Postgres with a per-run random password
        run: |
          PW="$(openssl rand -hex 24)"
          echo "::add-mask::$PW"
          docker run -d --name pg \
            -e POSTGRES_USER=hemfin_ci -e POSTGRES_DB=hemfin_ci -e POSTGRES_PASSWORD="$PW" \
            -p 127.0.0.1:5432:5432 postgres:16
          until docker exec pg pg_isready -h 127.0.0.1 -U hemfin_ci -d hemfin_ci; do sleep 1; done
          echo "DATABASE_URL=postgresql://hemfin_ci:${PW}@127.0.0.1:5432/hemfin_ci" >> "$GITHUB_ENV"
      - name: Smoke run against the Postgres container
        run: |
          # Host networking so the container reaches Postgres on 127.0.0.1:5432.
          docker run -d --name api --network host \
            -e APP_ENV=local -e PORT=8000 -e DATABASE_URL \
            hemfin-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then
              echo
              echo "api container is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::api container did not become ready"
          docker logs api
          exit 1

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # The drift check regenerates api/openapi.json with uv, so uv is needed here too.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: npm ci
      - run: npm test --workspaces --if-present
      - run: npm run check:api-drift
      - run: npm run lint --workspace web
      - run: npm run build --workspace web
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers and system deps
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright
        run: npx playwright test
        working-directory: web
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release's checksums file).
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # The binary is used instead of gitleaks/gitleaks-action: the action needs a paid
      # GITLEAKS_LICENSE for repos owned by an organization, while the binary is MIT and free.
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
